# .github/workflows/configure-cluster.yml

name: Configure Cluster

on:
  workflow_run:
    workflows: ["Create Azure AKS With Terraform"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  configure:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check if AKS exists
        id: check_aks
        run: |
          if az aks show --resource-group keycloak-k8s-resources --name keycloak-k8s &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if AKS doesn't exist
        if: steps.check_aks.outputs.exists == 'false'
        run: |
          echo "AKS cluster not found. Skipping configuration."
          exit 0

      - name: Get AKS credentials
        if: steps.check_aks.outputs.exists == 'true'
        run: az aks get-credentials --resource-group keycloak-k8s-resources --name keycloak-k8s --file ~/.kube/config

      - name: Install Ansible and K8s collection
        if: steps.check_aks.outputs.exists == 'true'
        run: |
          pip install ansible
          ansible-galaxy collection install kubernetes.core
          pip install kubernetes

      - name: Run Playbooks
        if: steps.check_aks.outputs.exists == 'true'
        run: |
          ansible-playbook ansible/playbooks/deploy_namespace.yaml
          ansible-playbook ansible/playbooks/deploy_secrets.yaml
          ansible-playbook ansible/playbooks/deploy_pvc.yaml
          ansible-playbook ansible/playbooks/deploy_postgres.yaml
          ansible-playbook ansible/playbooks/deploy_keycloak.yaml
          ansible-playbook ansible/playbooks/deploy_web.yaml
          ansible-playbook ansible/playbooks/deploy_configmap.yaml
          ansible-playbook ansible/playbooks/deploy_rbac.yaml
          ansible-playbook ansible/playbooks/deploy_sa.yaml
          ansible-playbook ansible/playbooks/external.yaml
          ansible-playbook ansible/playbooks/deploy_ingress.yaml
          ansible-playbook ansible/playbooks/deploy_oauth.yaml