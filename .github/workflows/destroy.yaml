name: Destroy Azure AKS With Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform workspace name (e.g. dev, aks, prod)"
        required: true
        default: "aks"
      destroy:
        description: "Set to true to confirm destruction"
        required: true
        default: "false"

env:
  BASE_DIR: ${{ github.workspace }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-aks-destroy
  cancel-in-progress: true

jobs:
  destroy:
    if: ${{ github.event.inputs.destroy == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init with Dynamic Backend Key
        working-directory: ${{ env.BASE_DIR }}/aks-cluster
        run: |
          terraform init \
            -backend-config="resource_group_name=my-tf-rg" \
            -backend-config="storage_account_name=mytfstateacct" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=aks/${{ github.event.inputs.environment }}/terraform.tfstate"

      - name: Select Workspace
        working-directory: ${{ env.BASE_DIR }}/aks-cluster
        run: terraform workspace select ${{ github.event.inputs.environment }} || terraform workspace new ${{ github.event.inputs.environment }}

      - name: Terraform Validate
        working-directory: ${{ env.BASE_DIR }}/aks-cluster
        run: terraform validate

      - name: Terraform Destroy
        working-directory: ${{ env.BASE_DIR }}/aks-cluster
        run: terraform destroy -auto-approve
