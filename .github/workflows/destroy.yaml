# destroy.yaml - GitHub Actions workflow to destroy all AKS and Azure resources using Terraform
# Triggered manually from the GitHub Actions UI for safety.

name: Destroy Azure AKS With Terraform

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-aks-destroy
  cancel-in-progress: true

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: aks-cluster

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Destroy)
        run: terraform plan -destroy

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

      - name: Notify on completion
        run: echo "Destroy complete!"