# deploy_ingress.yaml - Deploys the ingress controller and web app ingress
- name: Deploy Keycloak ingress and web application
  hosts: localhost
  tasks:
    - name: Apply Keycloak ingress and web application
      kubernetes.core.k8s:
        kubeconfig: ~/.kube/config
        state: present
        src: ../../kube/ingress.yaml
        namespace: ingress-nginx