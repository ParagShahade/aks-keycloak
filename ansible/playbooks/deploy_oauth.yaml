# deploy_oauth.yaml - Deploys the OAuth2 Proxy and related Ingress
- name: Deploy Keycloak oauth application
  hosts: localhost
  tasks:
    - name: Apply Keycloak oauth application
      kubernetes.core.k8s:
        kubeconfig: ~/.kube/config
        state: present
        src: ../../kube/oauth.yaml
        namespace: keycloak-app