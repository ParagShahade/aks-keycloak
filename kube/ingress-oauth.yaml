apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy-ingress
  namespace: keycloak-app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: auth.web.com
      http:
        paths:
          - path: /oauth2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
