# keycloak.yaml - Deploys Keycloak and its service in the keycloak-app namespace

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:latest
        args: ["start-dev"] # Development mode; use production args for prod
        env:
        - name: KC_HOSTNAME
          value: keycloak.web.com
        - name: KC_HOSTNAME_URL
          value: http://keycloak.web.com
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://postgres/keycloak
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: db-password # Reference to secret
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin-password # Reference to secret
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak-app
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080