apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
  namespace: keycloak-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
    - host: auth.web.com
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80

---
# 3. oauth2-proxy Deployment (Updated redirect-url)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: keycloak-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
          args:
            - --provider=keycloak
            - --client-id=test-web-app
            - --client-secret=dtSbHmJCilEw4ogEfS5UlLUJ7yRCHBhL
            - --cookie-secret=I_YJeqruh1s9xslMcJDh4eeUXBfMeRUVDvfb0FolMec=
            - --redirect-url=http://auth.web.com/oauth2/callback
            - --upstream=http://web.keycloak-app.svc.cluster.local:80/
            - --http-address=0.0.0.0:4180
            - --cookie-secure=false
            - --email-domain=*
          ports:
            - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: keycloak-app
spec:
  selector:
    app: oauth2-proxy
  ports:
    - port: 80
      targetPort: 4180