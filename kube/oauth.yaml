apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-app-ingress
  namespace: keycloak-app
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.keycloak-app.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "http://auth.web.com/oauth2/start"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User, X-Auth-Request-Email"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: auth.web.com
      http:
        paths:
          - path: /oauth2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: web
                port:
                  number: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: keycloak-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
          args:
            - --provider=keycloak
            - --client-id=test-web-app
            - --client-secret=dHL8BsCV8wVGaCniCsUFUiUNhg16fdas
            - --cookie-secret=1yfnVuLpJ88jiKQEBEJ6f274JZYvsYsC3d9MPsSJ7Gk=
            - --redirect-url=http://auth.web.com/oauth2/callback
            - --upstream=http://web.keycloak-app.svc.cluster.local:80/
            - --http-address=0.0.0.0:4180
            - --cookie-secure=false
            - --cookie-path=/
            - --email-domain=*
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --scope="openid email profile"
            - --session-cookie-minimal=false
          ports:
            - containerPort: 4180

---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: keycloak-app
spec:
  selector:
    app: oauth2-proxy
  ports:
    - port: 80
      targetPort: 4180

---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx
