# secrets.yaml - Stores sensitive credentials for Keycloak and OAuth2 Proxy
# NOTE: Base64 encoded values. For production, use a proper secret manager (e.g., Azure Key Vault).

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: keycloak-app
type: Opaque
data:
  # admin-password: admin (base64: YWRtaW4=)
  admin-password: YWRtaW4=
  # db-password: keycloakpass (base64: a2V5Y2xvYWtwYXNz)
  db-password: a2V5Y2xvYWtwYXNz
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: keycloak-app
type: Opaque
stringData:
  client-secret: WXz2rgD4Dg3ZtajSyep8i7tJo5dWXCFg
  cookie-secret: ltJW6jTz/OWVKOuO1vY7K5Xgkrbb3y4Xk/T0ZajvAiI=