# secrets.yaml - Stores sensitive credentials for Keycloak and OAuth2 Proxy
# NOTE: Base64 encoded values. For production, use a proper secret manager (e.g., Azure Key Vault).

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: keycloak-app
type: Opaque
data:
  # admin-password: admin (base64: YWRtaW4=)
  admin-password: YWRtaW4=
  # db-password: keycloakpass (base64: a2V5Y2xvYWtwYXNz)
  db-password: a2V5Y2xvYWtwYXNz
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: keycloak-app
type: Opaque
data:
  # client-secret: XruE7uwLivTw1ypOKg04eTtJPLv94zkM (base64: WHJ1RTd1d0xpdlR3MXlwT0tnMDRlVHRKUEx2OTR6a00=)
  client-secret: WHJ1RTd1d0xpdlR3MXlwT0tnMDRlVHRKUEx2OTR6a00=
  # cookie-secret: "dtC0sHREypjP9ap5BRj2T7GMraPvfHVZxT2jMyCtsj8=" (base64, 32 bytes)
  cookie-secret: dtC0sHREypjP9ap5BRj2T7GMraPvfHVZxT2jMyCtsj8=