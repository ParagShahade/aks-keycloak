# secrets.yaml - Stores sensitive credentials for Keycloak and OAuth2 Proxy
# NOTE: Base64 encoded values. For production, use a proper secret manager (e.g., Azure Key Vault).

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: keycloak-app
type: Opaque
data:
  # admin-password: admin (base64: YWRtaW4=)
  admin-password: YWRtaW4=
  # db-password: keycloakpass (base64: a2V5Y2xvYWtwYXNz)
  db-password: a2V5Y2xvYWtwYXNz
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: keycloak-app
type: Opaque
data:
  # client-secret: kvgB8bPjj2G0whIWaYuJCZz8eRPTXmuM (base64: a3ZnQjhiUGpqMkcwd2hJV2FZdUpDWno4ZVJQVFhtdU0=)
  client-secret: a3ZnQjhiUGpqMkcwd2hJV2FZdUpDWno4ZVJQVFhtdU0=
  # cookie-secret: "12345678901234567890123456789012" (base64: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=)
  cookie-secret: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=