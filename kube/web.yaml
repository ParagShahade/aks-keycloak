# web.yaml - Deploys the static web app and its service in the keycloak-app namespace

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: keycloak-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:alpine
        volumeMounts:
        - name: web-html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: web-html
        configMap:
          name: web-html
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: keycloak-app
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
